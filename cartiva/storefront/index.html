<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CARTIVA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="notice">
    Cartiva is a fictional store built for a data analytics portfolio project.
    Nothing here is for sale.
  </div>

  <header class="header">
    <button class="menu-button" id="menu-button" aria-label="Show categories">☰</button>
    <a class="logo" href="/shop/">CARTIVA</a>
    <div class="header-actions">
      <input class="search" id="search" type="search"
             placeholder="SEARCH" aria-label="Search products">
      <button class="bag-button" id="bag-button">BAG (<span id="bag-count">0</span>)</button>
    </div>
  </header>

  <nav class="categories" id="categories" aria-label="Categories"></nav>

  <main>
    <p class="result-count" id="result-count"></p>
    <section class="grid" id="grid" aria-live="polite"></section>
  </main>

  <aside class="bag" id="bag" aria-label="Shopping bag" hidden>
    <div class="bag-header">
      <h2>BAG</h2>
      <button class="close" id="bag-close" aria-label="Close bag">✕</button>
    </div>
    <div class="bag-items" id="bag-items"></div>
    <div class="bag-footer">
      <div class="bag-row"><span>SUBTOTAL</span><span id="bag-subtotal">$0.00</span></div>
      <p class="bag-note" id="bag-shipping-note"></p>
      <button class="primary" disabled>CHECKOUT (NOT AVAILABLE IN THIS DEMO)</button>
    </div>
  </aside>
  <div class="overlay" id="overlay" hidden></div>

  <div class="toast" id="toast" role="status" hidden></div>

  <footer class="footer">
    <p>CARTIVA · a fictional fashion store · portfolio project by Rucha Panhale</p>
    <p><a href="/docs">API documentation</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
